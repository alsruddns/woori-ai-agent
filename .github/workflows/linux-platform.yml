name: Linux platform compatibility

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-static-and-sandbox:
    name: Ubuntu adapter and sandbox checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PAID_AI_API_ENABLED: "false"
      AI_API_BUDGET_USD: "0"
      AI_AUTO_EXECUTION: "false"
      OPENAI_API_KEY: ""
      CODEX_API_KEY: ""
      GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install rootless bubblewrap prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - run: pnpm install --frozen-lockfile
      - name: TypeScript, lint, unit tests, and dashboard build
        run: pnpm typecheck && pnpm lint && WOORI_ALLOW_SYNTHETIC_TEST_EXECUTION=true pnpm test && pnpm build
      - name: Validate Linux deployment policy and shell syntax
        run: |
          for script in deploy/linux/install.sh deploy/linux/manage.sh deploy/linux/package.sh; do bash -n "$script"; done
          node scripts/validate-linux-package.mjs
      - name: Build and verify a production-only Ubuntu package without browser binaries
        run: |
          bash deploy/linux/package.sh "$RUNNER_TEMP/woori-package"
          archive="$(find "$RUNNER_TEMP/woori-package" -maxdepth 1 -name 'woori-ai-agent-linux-*.tar.gz' -print -quit)"
          digest="$(cut -d' ' -f1 "$archive.sha256")"
          bash deploy/linux/install.sh --action=verify --package="$archive" --sha256="$digest"
      - name: Record Linux host, namespace, AppArmor, systemd, and Codex sandbox diagnostics
        run: >-
          pnpm exec tsx -e 'import { diagnoseLinuxHost } from "./apps/cli/src/linux-runtime.ts";
          const result=diagnoseLinuxHost();
          console.log(JSON.stringify(result,null,2));
          if(result.sandboxBoundary.status!=="Ready" || result.systemdLimits.status!=="Ready") console.log("::warning::Linux host sandbox or cgroup prerequisites are not verified; Linux code modification remains disabled.");'
      - name: Probe rootless bubblewrap filesystem and network boundary
        run: >-
          pnpm exec tsx -e 'import { probeBubblewrapSandbox } from "./apps/cli/src/linux-runtime.ts";
          const result=probeBubblewrapSandbox();
          console.log(JSON.stringify(result));
          if(result.status!=="Ready") console.log("::warning::Rootless bubblewrap is unavailable on this runner; Linux Codex execution remains Not Configured.");'
