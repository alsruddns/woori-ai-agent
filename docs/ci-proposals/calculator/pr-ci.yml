name: PR CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-ci-calculator-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Activate locked pnpm version
        run: corepack enable && corepack prepare pnpm@9.12.1 --activate
      - name: Configure pnpm dependency cache
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: "Run pnpm lint"
        run: pnpm lint
      - name: "Run pnpm test"
        run: pnpm test
      - name: "Run pnpm typecheck"
        run: pnpm typecheck
      - name: "Run pnpm build"
        run: pnpm build
